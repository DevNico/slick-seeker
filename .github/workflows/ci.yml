name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  format-check:
    name: Check Formatting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: coursier/setup-action@v1
        with:
          apps: scalafmt

      - name: Check formatting
        run: scalafmt --check

  test:
    name: Test (Scala ${{ matrix.scala }} - Java ${{ matrix.java }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java: ['11', '17', '21', '25']
        scala: ['2.13.16', '3.3.5']
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - uses: coursier/cache-action@v6

      - uses: coursier/setup-action@v1
        with:
          jvm: temurin:${{ matrix.java }}
          apps: sbt

      - name: Compile
        run: sbt ++${{ matrix.scala }} compile

      - name: Run tests
        run: sbt ++${{ matrix.scala }} test

      - name: Check binary compatibility
        run: sbt ++${{ matrix.scala }} mimaReportBinaryIssues

  databases:
    name: Database (${{ matrix.database }} - Scala ${{ matrix.scala }})
    runs-on: ubuntu-latest

    # The default test job runs H2, HSQLDB and SQLite; these need Docker (Testcontainers) or Java 21 (Derby).
    # A selected database that can't start fails the job. One database per job, with each Scala version.
    strategy:
      matrix:
        database: [derby, postgresql, mysql, mariadb, sqlserver, oracle, cockroachdb]
        scala: ['2.13.16', '3.3.5']
      fail-fast: false

    env:
      SEEKER_DATABASES: ${{ matrix.database }}

    steps:
      - uses: actions/checkout@v4

      - uses: coursier/cache-action@v6

      - uses: coursier/setup-action@v1
        with:
          jvm: temurin:21
          apps: sbt

      - name: Run database tests
        run: >-
          sbt ++${{ matrix.scala }} "core/testOnly io.github.devnico.slickseeker.databases.*
          io.github.devnico.slickseeker.pagination.PostgreSqlSpec"

  docs:
    name: Check Documentation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r docs/requirements.txt

      - name: Build documentation
        run: cd docs && mkdocs build --strict
